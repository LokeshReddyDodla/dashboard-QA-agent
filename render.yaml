# Render Blueprint — deploys the helpline chatbot as an always-on web service.
# On Render: New + > Blueprint > connect this repo, and it reads this file.
services:
  - type: web
    name: dashboard-helpline-agent
    runtime: python
    plan: free                      # free tier; cold-starts after ~15 min idle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false                 # you enter this in the Render dashboard (kept secret, NOT in git)
      - key: MODEL
        value: gpt-4o-mini
      - key: TEMPERATURE
        value: "0.2"
      - key: PYTHON_VERSION
        value: "3.12.7"
